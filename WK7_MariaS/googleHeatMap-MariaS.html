    let map;
    let overlay;
    // Each dataset uses a distinct low-to-high density color gradient.
    const churchColors = [
      [146,234,255],
      [117,212,255],
      [0,105,255],
      [0,49,196],
      [0,22,162],
    ];
    const schoolColors = [
      [98,161,219],
      [231,216,125],
      [221,159,64],
      [180,69,31],
      [176,17,17],
    ];

    async function initMap() {
      try {
        if (!window.deck || !window.deck.HeatmapLayer || !window.deck.GoogleMapsOverlay) {
          throw new Error("The deck.gl bundle did not load.");
        }

        const { Map } = await google.maps.importLibrary("maps");
        map = new Map(document.getElementById("map"), {
          center: { lat: 33.448376, lng: -112.074036 },
          zoom: 6,
          mapId: "68e6ea49dbd7aa957ae466a6", // Replace with your own Map ID
        });

        overlay = new deck.GoogleMapsOverlay({
          layers: createLayers(),
          interleaved: false,
        });
        overlay.setMap(map);

        document.getElementById("schools").addEventListener("change", updateLayers);
        document.getElementById("churches").addEventListener("change", updateLayers);
      } catch (error) {
        console.error("Could not initialize the heatmap demo.", error);
        document.getElementById("controls").textContent =
          `Could not load the map: ${error.message || error}`;
      }
    }

    function createLayers() {
      return [
        new deck.HeatmapLayer({
          id: "catholic-churches",
          data: churches,
          getPosition: (place) => [place.lon, place.lat],
          radiusPixels: 30,
          threshold: 0.1,
          colorRange: churchColors,
          visible: document.getElementById("churches").checked,
        }),

        new deck.HeatmapLayer({
          id: "schools",
          data: schools,
          getPosition: (place) => [place.lon, place.lat],
          radiusPixels: 30,
          threshold: 0.1,
          colorRange: schoolColors,
          visible: document.getElementById("schools").checked,
        }),
        
      ];
    }

    function updateLayers() {
      overlay.setProps({ layers: createLayers() });
    }

    window.initMap = initMap;
